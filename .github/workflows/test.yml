name: Takeoff Bridge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # Toolchain floor: next@16 needs >=20.9, vite@7 needs ^20.19 || >=22.12,
        # supabase-js@2.106 needs >=20 — Node 18 fails vitest startup (ERR_REQUIRE_ESM).
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Unit Tests
      run: npm run test

    - name: Run Build (Next.js Verify)
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-url.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
      run: npm run build
